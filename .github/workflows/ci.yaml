name: Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x, 24.x, 26.x]

    services:
      postgres:
        image: postgres
        env:
          POSTGRES_PASSWORD: test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}
      - name: Setup environment
        run: |
          cp ./packages/api/.env.example ./packages/api/.env
          echo "OPENID_URL=https://dev-xsabpsprsxx67nah.us.auth0.com" >>./packages/api/.env
          echo "ALLOWED_USERS=auth0|e2e-user" >>./packages/api/.env
          echo "MOCK_AUTH=true" >>./packages/api/.env
          cp ./packages/web/.env.example ./packages/web/.env
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browser
        run: npm exec --workspace=@eheikes/oscar-web -- playwright install --with-deps chromium
      - name: Start API server for web tests
        run: |
          NODE_ENV=test PORT=3000 CORS_ALLOWED_ORIGIN=https://127.0.0.1:4173 RATE_LIMITING_MAX=100000 \
            npm run start --workspace=@eheikes/oscar-api > /tmp/oscar-api.log 2>&1 &
          # Any HTTP response (even a 401) means the server is up.
          for i in {1..30}; do
            if curl -sS -o /dev/null http://localhost:3000/items; then
              echo "API is ready"
              break
            fi
            sleep 1
          done
          curl -sS -o /dev/null http://localhost:3000/items || { cat /tmp/oscar-api.log; exit 1; }
      - name: Run linter
        run: npm run lint --if-present
      - name: Run build
        run: npm run build --if-present
      - name: Run tests
        run: npm run test --if-present
      # - name: Upload coverage report
      #   uses: codecov/codecov-action@v2
